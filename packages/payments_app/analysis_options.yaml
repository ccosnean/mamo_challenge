include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - build/**
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    public_member_api_docs: false
    # On newer SDKs this lint suggests private named initializing formals
    # (`required this._x`), which older SDKs/IDEs reject as experimental.
    prefer_initializing_formals: false
