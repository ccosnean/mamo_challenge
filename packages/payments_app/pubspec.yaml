name: payments_app
description: "Payment approval flow (Flutter technical challenge)."
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  clock: ^1.1.2
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  intl: ^0.20.3
  json_annotation: ^4.11.0
  local_auth: ^3.0.2
  logging: ^1.3.0
  meta: ^1.18.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  # The only freezed that supports this SDK's analyzer: 4.x needs Dart 3.13,
  # and 3.2.3 conflicts with json_serializable. Move to ^4 with the SDK.
  freezed: 3.2.6-dev.1
  json_serializable: ^6.13.2
  # Test-only: the app's tests talk to the mock bank over real dio/JSON.
  # Never a runtime dependency.
  mock_bank:
    path: ../mock_bank
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  # Manrope (UI) and DM Mono (money), SIL Open Font License: see
  # lib/fonts/OFL-*.txt. Manrope weights are static instances of the
  # variable font so `fontWeight` works on every platform.
  fonts:
    - family: Manrope
      fonts:
        - asset: lib/fonts/Manrope-500.ttf
          weight: 500
        - asset: lib/fonts/Manrope-600.ttf
          weight: 600
        - asset: lib/fonts/Manrope-700.ttf
          weight: 700
        - asset: lib/fonts/Manrope-800.ttf
          weight: 800
    - family: DMMono
      fonts:
        - asset: lib/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: lib/fonts/DMMono-Medium.ttf
          weight: 500
